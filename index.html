<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex ❤️ Vivien</title>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff758f;
            --text-color: #590d22;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffccd5 0%, #ffb3c1 100%);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            overflow: hidden; /* Aby srdiečka neutekali */
        }

        /* Plávajúce srdiečka v pozadí */
        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.2);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 40px 20px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
        }

        .main-heart {
            font-size: 60px;
            margin-bottom: 10px;
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.5));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            margin: 0;
            color: var(--primary-color);
        }

        .names {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .counter-box {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .counter-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: block;
            color: #c9184a;
        }

        .time-unit {
            display: block;
            font-size: 1.2rem;
            margin: 5px 0;
            font-weight: 400;
        }

        .quote {
            font-style: italic;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .footer-info {
            font-size: 0.85rem;
            opacity: 0.8;
            border-top: 1px solid rgba(255, 77, 109, 0.2);
            padding-top: 20px;
        }

        .signature {
            font-family: 'Sacramento', cursive;
            font-size: 2.2rem;
            display: block;
            margin-top: 10px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <div class="main-heart">💖</div>
        <h1>Navždy spolu...</h1>
        <div class="names">Alex & Vivien</div>

        <div class="counter-box">
            <span class="counter-title">Už spolu kráčame životom:</span>
            <div id="timer">
                <span class="time-unit" id="years-days"></span>
                <span class="time-unit" id="h-m-s"></span>
            </div>
        </div>

        <div class="quote">
            „Láska nie je o tom, koľko dní ste spolu, ale o tom, koľko lásky ste do tých dní vložili.“
        </div>

        <div class="footer-info">
            Začali sme: 25. 01. 2025 o 19:00<br>
            Milujem ťa viac s každou sekundou!
            <span class="signature">Tvoj Alex</span>
        </div>
    </div>

    <script>
        const startDate = new Date("2025-01-25T19:00:00");

        // Skloňovanie slovenských názvov
        function declension(val, one, few, many) {
            if (val === 1) return val + " " + one;
            if (val >= 2 && val <= 4) return val + " " + few;
            return val + " " + many;
        }

        function update() {
            const now = new Date();
            let diff = now - startDate;

            let seconds = Math.floor(diff / 1000);
            let minutes = Math.floor(seconds / 60);
            let hours = Math.floor(minutes / 60);
            let days = Math.floor(hours / 24);

            let displaySeconds = seconds % 60;
            let displayMinutes = minutes % 60;
            let displayHours = hours % 24;

            // Výpočet rokov a mesiacov (presnejšie)
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let d = now.getDate() - startDate.getDate();

            if (d < 0) {
                months--;
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            // Zjednodušený výpočet dní pre zobrazenie
            let totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            document.getElementById('years-days').innerHTML = 
                declension(years, "rok", "roky", "rokov") + ", " + 
                declension(totalDays % 365, "deň", "dni", "dní");

            document.getElementById('h-m-s').innerHTML = 
                declension(displayHours, "hodinu", "hodiny", "hodín") + ", " + 
                declension(displayMinutes, "minútu", "minúty", "minút") + " a " + 
                declension(displaySeconds, "sekundu", "sekundy", "sekúnd");
        }

        // Generovanie srdiečok na pozadí
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 5 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.getElementById('hearts-container').appendChild(heart);

            setTimeout(() => { heart.remove(); }, 10000);
        }

        setInterval(update, 1000);
        setInterval(createHeart, 600);
        update();
    </script>
</body>
</html>
